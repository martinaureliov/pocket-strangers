name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSLf -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          rm godot.zip

      - name: Import project
        timeout-minutes: 5
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee import.log

      - name: Run GDScript tests
        timeout-minutes: 5
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_runner.gd 2>&1 | tee test.log

      # Surface error lines as one annotation, so failures are readable without opening the logs.
      - name: Report errors
        if: failure()
        run: |
          lines=$(cat import.log test.log 2>/dev/null | grep -E "FAIL|ERROR|Error|error|Results:|at: " | head -60 || true)
          msg=$(printf '%s' "${lines:-no error lines found}" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Godot errors::${msg}"
